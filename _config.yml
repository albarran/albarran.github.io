# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Pedro Albarran"
title_separator          : "-"
name                     : &name "Pedro Albarran"
description              : &description "Pedro Albarran — Associate Professor, Universidad de Alicante. Microeconometrics, labor and applied economics."
url                      : https://albarran.github.io
baseurl                  : ""
repository               : "albarran/albarran.github.io"

# Site Author
author:
  avatar           :
  name             : "Pedro Albarran"
  pronouns         :
  bio              : "Associate Professor, Department of Economics (FAE), Universidad de Alicante."
  location         : "Alicante, Spain"
  employer         : "Universidad de Alicante"
  uri              : "https://albarran.github.io"
  email            : "albarran@ua.es"

  # Academic profiles
  googlescholar    : "https://scholar.google.es/citations?hl=en&user=B4eNzrIAAAAJ"
  orcid            : "https://orcid.org/0000-0002-2277-9719"
  scopus           : "https://www.scopus.com/authid/detail.uri?authorId=6506109060"
  researchgate     :
  semantic         :
  ssrn             :
  zotero           :

  # Code
  github           : "albarran"

# Publication categories
publication_category:
  manuscripts:
    title: 'Journal Articles'
  bookchapters:
    title: 'Book Chapters'
  workinprogress:
    title: 'Work in Progress'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
atom_feed:
  hide                   : true

# SEO
google_site_verification :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Madrid

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
